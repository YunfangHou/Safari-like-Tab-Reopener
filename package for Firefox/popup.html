<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionSettings">Settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main>
        <h1 data-i18n="extensionSettings">Settings</h1>
        <section id="toolbar-click-settings" aria-labelledby="toolbar-click-heading" hidden>
            <h2 id="toolbar-click-heading" data-i18n="toolbarClickHeading">When clicking the extension icon</h2>
            <label class="setting-choice">
                <span data-i18n="toolbarClickLabel">Left-click action</span>
                <select id="toolbar-click-action" disabled>
                    <option value="popup" data-i18n="toolbarClickPopup">Open settings (default)</option>
                    <option value="restore" data-i18n="toolbarClickRestore">Reopen the last closed tab</option>
                </select>
            </label>
            <p class="setting-help" data-i18n="toolbarClickHelp">You can always right-click the icon and choose Settings… to open this panel.</p>
        </section>
        <section aria-labelledby="reopen-button-heading">
            <h2 id="reopen-button-heading" data-i18n="reopenButtonSettings">Reopen button</h2>
            <label class="setting-toggle">
                <input id="show-reopen-button" type="checkbox" disabled>
                <span data-i18n="showReopenButton">Show a draggable reopen button on web pages</span>
            </label>
        </section>
        <section class="current-site" aria-labelledby="current-site-heading">
            <h2 id="current-site-heading" data-i18n="currentWebsite">Current website</h2>
            <div id="current-host" data-i18n="loading">Loading…</div>
            <button id="toggle-current" type="button" disabled data-i18n="excludeThisWebsite">Exclude this website</button>
        </section>
        <section aria-labelledby="list-heading">
            <h2 id="list-heading" data-i18n="yourList">Your list</h2>
            <p id="empty-list" data-i18n="noExcludedWebsites">No excluded websites yet.</p>
            <ul id="excluded-list"></ul>
        </section>
        <button id="manage-list" class="secondary" type="button" data-i18n="editFullList">Edit full list</button>
        <section class="report-issue" aria-labelledby="report-heading">
            <h2 id="report-heading" data-i18n="reportIssue">Report an issue</h2>
            <div class="report-actions">
                <button id="quick-report" class="secondary" type="button" disabled data-i18n="quickReport">Quick report</button>
                <button id="describe-report" class="secondary" type="button" disabled data-i18n="reportWithDescription">Report with description</button>
            </div>
            <div id="report-form" hidden>
                <label for="report-description" data-i18n="issueDescription">What went wrong?</label>
                <textarea id="report-description" rows="3" maxlength="2000" data-i18n-placeholder="issueDescriptionPlaceholder"></textarea>
                <div class="report-actions">
                    <button id="send-report" type="button" data-i18n="openEmailReport">Open email report</button>
                    <button id="cancel-report" class="secondary" type="button" data-i18n="cancel">Cancel</button>
                </div>
            </div>
        </section>
        <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>
</html>
